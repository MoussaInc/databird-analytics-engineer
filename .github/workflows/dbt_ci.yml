# .github/workflows/dbt_ci.yml

name: dbt CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "03_dbt/dbt_analytics/**"

env:
  PYTHON_VERSION: "3.11"
  DBT_PROJECT_DIR: "03_dbt/dbt_analytics"
  DBT_PROFILES_DIR: ~/.dbt

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.DBT_PROJECT_DIR }}

    steps:
      # ==========================================
      # Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ==========================================
      # Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery google-cloud-bigquery

      # ==========================================
      # Setup GCP credentials
      # ==========================================
      - name: Setup GCP credentials
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT_KEY" > /tmp/keyfile.json
          chmod 600 /tmp/keyfile.json

      # ==========================================
      # Setup dbt profile
      # ==========================================
      - name: Setup dbt profile
        env:
          DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
        run: |
          mkdir -p ~/.dbt
          echo "$DBT_PROFILES_YML" > ~/.dbt/profiles.yml

      # ==========================================
      # Debug environment
      # ==========================================
      - name: Check environment
        run: |
          pwd
          ls -la
          dbt --version

      # ==========================================
      # Validate dbt connection
      # ==========================================
      - name: dbt debug
        run: dbt debug

      # ==========================================
      # Install dbt packages
      # ==========================================
      - name: dbt deps
        run: dbt deps

      # ==========================================
      # Parse project
      # ==========================================
      - name: dbt parse
        run: dbt parse

      # ==========================================
      # Compile project
      # ==========================================
      - name: dbt compile
        run: dbt compile

      # ==========================================
      # Build project
      # ==========================================
      - name: dbt build
        run: dbt build

      # ==========================================
      # Run tests
      # ==========================================
      - name: dbt test
        run: dbt test

      # ==========================================
      # Upload artifacts
      # ==========================================
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            03_dbt/dbt_analytics/target/
            03_dbt/dbt_analytics/logs/

      # ==========================================
      # Cleanup temporary datasets
      # ==========================================
      - name: Cleanup CI dataset
        if: always()
        run: |
          python << EOF
          from google.cloud import bigquery

          client = bigquery.Client.from_service_account_json(
              "/tmp/keyfile.json"
          )

          datasets = list(client.list_datasets())

          for dataset in datasets:
              if dataset.dataset_id.startswith("dbt_ci"):
                  dataset_id = f"{dataset.project}.{dataset.dataset_id}"

                  client.delete_dataset(
                      dataset_id,
                      delete_contents=True,
                      not_found_ok=True
                  )

                  print(f"Deleted dataset: {dataset_id}")

          EOF