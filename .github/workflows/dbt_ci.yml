
# .github/workflows/dbt_ci.yml
name: dbt CI — Pull Request Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "03_dbt/dbt_analytics/**"

env:
  PYTHON_VERSION: "3.11"
  DBT_PROJECT_DIR: 03_dbt/dbt_analytics
  DBT_PROFILES_DIR: ~/.dbt

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.DBT_PROJECT_DIR }}

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Setup Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery google-cloud-bigquery

      # =========================
      # Setup GCP credentials
      # =========================
      - name: Setup GCP credentials
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT_KEY" > /tmp/keyfile.json
          chmod 600 /tmp/keyfile.json

      # =========================
      # Setup dbt profiles.yml
      # =========================
      - name: Setup dbt profile
        env:
          DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
        run: |
          mkdir -p ~/.dbt
          echo "$DBT_PROFILES_YML" > ~/.dbt/profiles.yml

      # =========================
      # Verify dbt connection
      # =========================
      - name: dbt debug
        run: dbt debug

      # =========================
      # Install dbt packages
      # =========================
      - name: dbt deps
        run: dbt deps

      # =========================
      # Validate project
      # =========================
      - name: dbt parse
        run: dbt parse

      - name: dbt compile
        run: dbt compile

      # =========================
      # Build modified models
      # =========================
      - name: dbt build
        run: |
          dbt build \
            --select state:modified+ \
            --defer \
            --state ./prod_artifacts

      # =========================
      # Upload artifacts
      # =========================
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            03_dbt/dbt_analytics/target/
            03_dbt/dbt_analytics/logs/

      # =========================
      # Cleanup dataset
      # =========================
      - name: Cleanup CI dataset
        if: always()
        run: |
          python << EOF
          from google.cloud import bigquery
          client = bigquery.Client.from_service_account_json(
              "/tmp/keyfile.json"
          )

          dataset_id = (
              "databird-formation-494820."
              "dbt_ci_${{ github.event.pull_request.number }}"
          )

          client.delete_dataset(
              dataset_id,
              delete_contents=True,
              not_found_ok=True
          )

          print(f"Deleted dataset: {dataset_id}")
          EOF
