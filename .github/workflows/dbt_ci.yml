# .github/workflows/dbt_ci.yml
name: dbt CI — Pull Request Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "03_dbt/dbt_analytics/**"
      - ".github/workflows/dbt_ci.yml"

env:
  PYTHON_VERSION: "3.11"
  DBT_PROJECT_DIR: "03_dbt/dbt_analytics"

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_dbt/dbt_analytics

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 3. Installer dbt + bigquery
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery google-cloud-bigquery

      # 4. Credentials GCP
      - name: Setup GCP credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/keyfile.json
          chmod 600 /tmp/keyfile.json

      # 5. profiles.yml dynamique
      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << PROFILE
          databird_analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: databird-formation-494820
                dataset: dbt_ci_pr_${{ github.event.pull_request.number }}
                keyfile: /tmp/keyfile.json
                threads: 4
                location: US
                timeout_seconds: 300
          PROFILE

      # 6. Vérifier l'environnement
      - name: Check environment
        run: |
          pwd
          ls -la
          dbt --version

      # 7. Connexion BigQuery
      - name: dbt debug
        run: dbt debug

      # 8. Packages
      - name: dbt deps
        run: dbt deps

      # 9. Slim CI si manifest dispo, sinon full build
      - name: dbt build
        run: |
          if [ -f prod_artifacts/manifest.json ]; then
            echo "✅ Manifest trouvé — Slim CI (modèles modifiés uniquement)"
            dbt build \
              --select state:modified+ \
              --defer \
              --state prod_artifacts
          else
            echo "⚠️ Pas de manifest — Full build"
            dbt build
          fi

      # 10. Sauvegarder les artefacts pour le prochain CI
      - name: Upload dbt artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: 03_dbt/dbt_analytics/target/manifest.json

      # 11. Nettoyage dataset CI
      - name: Cleanup CI dataset
        if: always()
        run: |
          python3 << PYEOF
          from google.cloud import bigquery
          client = bigquery.Client.from_service_account_json("/tmp/keyfile.json")
          pr_number = "${{ github.event.pull_request.number }}"
          dataset_id = f"databird-formation-494820.dbt_ci_pr_{pr_number}"
          client.delete_dataset(dataset_id, delete_contents=True, not_found_ok=True)
          print(f"✅ Dataset {dataset_id} supprimé")
          PYEOF