version: 2

models:
  - name: agg_listings
    description: "Aggregated model showing average listing prices by neighborhood and room type"

    columns:
      - name: neighbourhood_cleansed
        description: "Neighborhood where the listing is located"

      - name: room_type
        description: "Type of accommodation"

      - name: avg_listing_price
        description: "Average listing price in USD"

      - name: total_listings
        description: "Total number of listings"