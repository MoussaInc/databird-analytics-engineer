name: 'dbt_analytics'
version: '1.0.0'
config-version: 2

profile: 'databird_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  +persist_docs:
    relation: true
    columns: true
  dbt_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
      ga4:
        +materialized: table
    mart:
      +materialized: table

vars:
  order_status_list: ['approved', 'canceled', 'created', 'delivered', 'invoiced', 'processing', 'shipped', 'unavailable']
  payment_type_list: ['credit_card', 'debit_card', 'blipay', 'voucher', 'not_defined']
  room_type_list: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

flags:
  require_generic_test_arguments_property: true