name: 'dbt_snow'
version: '1.0.0'
profile: 'dbt_snow'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:

  +persist_docs:
    relation: true
    columns: true

  dbt_snow:

    staging:
      +schema: staging
      +materialized: view

    intermediate:
      +schema: intermediate
      +materialized: view
      
    marts:
      +schema: marts
      +materialized: table