# models/intermediate/int_schema.yml

version: 2

models:
  - name: int_order_items_enriched
    description: >
      Intermediate model enriching order items with product, category, and brand information.
      Computes revenue metrics for each order line including gross revenue, net revenue,
      and discount amount.

    columns:
      - name: order_item_id
        description: Surrogate key uniquely identifying each order line.
        tests:
          - not_null
          - unique

      - name: order_id
        description: Identifier of the related order.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: item_id
        description: Line item number within the order.
        tests:
          - not_null

      - name: product_id
        description: Identifier of the purchased product.
        tests:
          - not_null
          - relationships:
              arguments:  
                to: ref('stg_products')
                field: product_id

      - name: product_name
        description: Name of the purchased product.

      - name: category_id
        description: Identifier of the product category.

      - name: category_name
        description: Name of the product category.

      - name: brand_id
        description: Identifier of the product brand.
        tests:
          - relationships:
              arguments:
                to: ref('stg_brands')
                field: brand_id

      - name: brand_name
        description: Name of the product brand.

      - name: quantity
        description: Quantity of the product ordered.
        tests:
          - not_null

      - name: price
        description: Unit price of the product at the time of purchase.
        tests:
          - not_null

      - name: discount
        description: Discount rate applied to the order item (between 0 and 1).
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 and discount <= 1"

      - name: unit_price_net
        description: Unit price after discount applied.

      - name: revenue_gross
        description: Gross revenue before discount — quantity * price.

      - name: revenue_net
        description: Net revenue after discount — quantity * price * (1 - discount).

      - name: discount_amount
        description: Total discount amount applied — quantity * price * discount.

  - name: int_orders_enriched
    description: >
      Intermediate model enriching orders with customer, store, and staff information.
      Computes delivery delay metrics and on-time delivery status for each order.

    columns:
      - name: order_id
        description: Unique identifier of the order.
        tests:
          - not_null
          - unique

      - name: order_status
        description: >
          Human-readable order status derived from the raw status code.
          Values: Pending, Processing, Rejected, Completed, Refunded, Unknown_status.
        tests:
          - not_null
          - accepted_status_values

      - name: order_at
        description: Date when the order was created.
        tests:
          - not_null

      - name: required_at
        description: Expected delivery date requested for the order.

      - name: shipped_at
        description: Date when the order was shipped.

      - name: customer_id
        description: Identifier of the customer who placed the order.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: customer_name
        description: Full name of the customer.

      - name: customer_city
        description: City of the customer.

      - name: customer_state
        description: State of the customer.

      - name: store_id
        description: Identifier of the store where the order was placed.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id

      - name: store_name
        description: Name of the store.

      - name: store_city
        description: City where the store is located.

      - name: store_state
        description: State where the store is located.

      - name: staff_id
        description: Identifier of the staff member who handled the order.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_staffs')
                field: staff_id

      - name: staff_name
        description: Full name of the staff member.

      - name: delivery_delay_days
        description: Number of days between order date and shipped date.

      - name: expected_delay_days
        description: Number of days between order date and required date.

      - name: is_on_time
        description: Boolean indicating whether the order was shipped on or before the required date.
        tests:
          - not_null